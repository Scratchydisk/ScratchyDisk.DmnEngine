name: CodeQL

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    # Weekly, so new queries are applied to unchanged code.
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: [ csharp, actions ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds queries for injection, path handling and unsafe
          # deserialization, which is what this engine needs.
          queries: security-extended

      # C# is a compiled language: CodeQL analyses the compiled program, so the
      # solution has to build. GitHub Actions workflows are analysed without a build.
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build ScratchyDisk.DmnEngine.sln -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
