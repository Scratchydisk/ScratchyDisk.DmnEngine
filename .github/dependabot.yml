version: 2

updates:
  # Runtime and test NuGet dependencies. Grouped so a routine round of updates is
  # one reviewable pull request rather than a dozen.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # FluentAssertions 8 moved to a paid licence (Xceed); this repository stays on
      # the Apache-2.0 7.x line. Revisit if the licence situation changes.
      - dependency-name: "FluentAssertions"
        versions: [ ">=8.0.0" ]
      # CsvHelper 34 reshapes CsvHelper.Configuration; the testbed's CSV import
      # needs a migration before the major can be taken.
      - dependency-name: "CsvHelper"
        update-types: [ "version-update:semver-major" ]
    groups:
      runtime:
        patterns:
          - "NLog"
          - "Antlr4.Runtime.Standard"
          - "CsvHelper"
      test:
        patterns:
          - "MSTest.*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.collector"
          - "FluentAssertions"
      # Build-time only. Kept in its own group because it drives grammar generation
      # and must be reviewed together with the ANTLR grammar files.
      build-tooling:
        patterns:
          - "Antlr4BuildTasks"
          - "Microsoft.Build.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # v2.6.0 publishes an OCI image index whose child manifests are missing, so the
      # runner cannot pull it. Ignore that release only; a fixed 2.6.1 will still be
      # proposed.
      - dependency-name: "ossf/scorecard-action"
        versions: [ "2.6.0" ]
    groups:
      actions:
        patterns:
          - "*"
